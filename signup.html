<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — WanderPass</title>
<meta name="description" content="Create your WanderPass traveler account." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main class="voyage-bg">
  <section class="ticket">
    <div class="ticket__stub">
      <div>
        <span class="ticket__mark">WanderPass · Traveler ID</span>
        <h1 class="ticket__title">Begin your journey.</h1>
        <p class="ticket__lede">Create one account to book stays, tours and guides across every WanderPass destination.</p>
      </div>
      <div class="stamp" aria-hidden="true">
        <span>New<br />Arrival<br />★ 2026 ★</span>
      </div>
      <p class="ticket__footer-note">FORM 01 / SIGN&nbsp;UP</p>
    </div>

    <div class="ticket__form-panel">
      <div class="panel-head">
        <h2>Create your account</h2>
        <p>All fields are required to complete your traveler profile.</p>
      </div>

      <div id="signup-banner" class="form-banner" role="alert"></div>

      <form id="signup-form" novalidate>
        <div class="field-grid cols-2">
          <div class="field" id="fullName-field">
            <label for="fullName">Full name</label>
            <div class="input-wrap">
              <input type="text" id="fullName" name="fullName" placeholder="Asha Menon" autocomplete="name" />
            </div>
            <div class="hint" id="fullName-hint"></div>
          </div>

          <div class="field" id="email-field">
            <label for="email">Email</label>
            <div class="input-wrap">
              <input type="email" id="email" name="email" placeholder="you@mail.com" autocomplete="email" />
            </div>
            <div class="hint" id="email-hint"></div>
          </div>
        </div>

        <div class="field-grid cols-2">
          <div class="field" id="phone-field">
            <label for="phone">Phone number</label>
            <div class="input-wrap">
              <input type="tel" id="phone" name="phone" placeholder="9876543210" autocomplete="tel" inputmode="numeric" maxlength="10" />
            </div>
            <div class="hint" id="phone-hint"></div>
          </div>

          <div class="field" id="city-field">
            <label for="city">Location / City</label>
            <div class="input-wrap">
              <input type="text" id="city" name="city" placeholder="Kochi" autocomplete="address-level2" />
            </div>
            <div class="hint" id="city-hint"></div>
          </div>
        </div>

        <div class="field-grid cols-2">
          <div class="field" id="password-field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input type="password" id="password" name="password" placeholder="Min. 8 chars, letters + numbers" autocomplete="new-password" />
              <button type="button" class="pw-toggle" data-target="password" aria-pressed="false">Show</button>
            </div>
            <div class="hint" id="password-hint"></div>
          </div>

          <div class="field" id="confirmPassword-field">
            <label for="confirmPassword">Confirm password</label>
            <div class="input-wrap">
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" />
              <button type="button" class="pw-toggle" data-target="confirmPassword" aria-pressed="false">Show</button>
            </div>
            <div class="hint" id="confirmPassword-hint"></div>
          </div>
        </div>

        <button type="submit" class="btn-primary">Create account</button>
        <p class="switch-line">Already have an account? <a href="signin.html">Sign in</a></p>
      </form>
    </div>
  </section>
</main>

<script src="js/validators.js"></script>
<script src="js/store.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
